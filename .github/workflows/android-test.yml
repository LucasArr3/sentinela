name: Testar alarme no emulador Android
on:
  workflow_dispatch:
  push:
    branches: ['ccr-*']
    paths: ['sentinela-app/**', '.github/workflows/android-test.yml']
permissions:
  contents: read
concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sentinela-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar interface e compilar APK de depuração
        run: |
          cd sentinela-app && npm ci && node scripts/prepare-web.mjs && npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Liberar KVM (emulador rápido)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Testar o alarme no emulador (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash sentinela-app/scripts/emulator-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulador-resultados
          path: emulator-out
          if-no-files-found: ignore
